name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install npm dependencies
        run: npm install

      - name: Restore .NET tools
        run: dotnet tool restore

      - name: Build
        run: dotnet build treemon.slnx

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Test extensions
        run: npm run test:extension

      - name: Test .NET
        run: dotnet test src/Tests/Tests.fsproj --filter "Category!=Local" --no-build --verbosity normal

  terminal-windows:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install npm dependencies
        run: npm install

      - name: Install pinned ttyd
        shell: pwsh
        run: pwsh -NoProfile -File scripts\setup-ttyd.ps1

      - name: Restore .NET tools
        run: dotnet tool restore

      - name: Build Release
        run: dotnet build treemon.slnx --configuration Release

      - name: Test ttyd verifier
        run: npm run test:ttyd-runtime-unit

      - name: Test terminal runtime
        run: dotnet test src/Tests/Tests.fsproj --configuration Release --no-build --filter "Category=Unit&FullyQualifiedName~EmbeddedTerminal" --verbosity normal && dotnet test src/Tests/Tests.fsproj --configuration Release --no-build --filter "TestCategory=TerminalHost" --verbosity normal && dotnet test src/Tests/Tests.fsproj --configuration Release --no-build --filter "FullyQualifiedName~WorktreePathResolutionTests" --verbosity normal

      - name: Test Treemon deployment preflight
        run: npm run test:treemon-deployment

      - name: Publish runtime layout
        run: dotnet publish src/Server/Server.fsproj --configuration Release --no-build --output .agents/ci-publish

      - name: Verify pinned ttyd runtime
        run: npm run test:ttyd-runtime
