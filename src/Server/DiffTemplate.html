<!DOCTYPE html>
<!-- treemon:generated worktree-diff-viewer — regenerated by Treemon; edits here are overwritten -->
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Worktree Diff</title>
<link rel="stylesheet" href="/assets/diff2html/3.4.52/diff2html.min.css">
<script>window.canvasSelectionConfig = { includeSurroundingContext: false };</script>
<link rel="stylesheet" href="/assets/diff/viewer.css">
<script src="/assets/diff2html/3.4.52/diff2html.min.js"></script>
</head>
<body>
<div class="shell">
    <header class="toolbar">
        <div class="title">
            <strong>Worktree diff</strong>
            <span id="base-label">Loading comparison…</span>
        </div>
        <div class="view-toggle" role="group" aria-label="Diff layout">
            <button id="unified-view" type="button" aria-label="Unified view" title="Unified view" aria-pressed="true">
                <svg class="toolbar-icon" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" aria-hidden="true" focusable="false">
                    <path d="M3 4h10M3 8h10M3 12h10"></path>
                </svg>
            </button>
            <button id="split-view" type="button" aria-label="Split view" title="Split view" aria-pressed="false">
                <svg class="toolbar-icon" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" aria-hidden="true" focusable="false">
                    <path d="M2.5 3.5h4v9h-4zM9.5 3.5h4v9h-4z"></path>
                </svg>
            </button>
        </div>
        <button id="refresh" class="refresh-button" type="button" aria-label="Refresh diff" title="Refresh diff">
            <svg class="toolbar-icon" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
                <path d="M13 5V2.5l-1.6 1.6A5.5 5.5 0 1 0 13.2 10"></path>
            </svg>
        </button>
    </header>
    <div class="workspace">
        <main id="content" class="content" aria-label="Changed files">
            <div id="layer-filters" class="layer-filters" role="group" aria-label="Include changes">
                <label class="layer-filter">
                    <input id="filter-committed" type="checkbox">
                    <span>Already committed</span>
                    <span id="count-committed" class="layer-count" aria-live="polite">…</span>
                </label>
                <label class="layer-filter">
                    <input id="filter-local" type="checkbox">
                    <span>Local changes</span>
                    <span id="count-local" class="layer-count" aria-live="polite">…</span>
                </label>
                <label class="layer-filter">
                    <input id="filter-untracked" type="checkbox">
                    <span>Untracked</span>
                    <span id="count-untracked" class="layer-count" aria-live="polite">…</span>
                </label>
            </div>
            <div id="change-summary" class="change-summary" aria-live="polite"></div>
            <div id="category-warning" class="category-warning" role="status"></div>
            <div id="file-list" class="file-list"></div>
            <div id="summary-state" aria-live="polite">
                <div class="state-card" data-state="loading-summary">
                    <div class="spinner" aria-hidden="true"></div>
                    <div class="state-title">Loading changed files…</div>
                </div>
            </div>
        </main>
    </div>
</div>

<script src="/assets/diff/viewer.js"></script>
</body>
</html>
